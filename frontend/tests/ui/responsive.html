<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AutoTrip · Responsive UI preview</title><style>body{margin:0;background:#dce4ee;font:12px system-ui}header{padding:10px;display:flex;gap:8px;align-items:center}iframe{border:0;transform-origin:top left;background:white}#stage{overflow:hidden}</style></head><body><header><label>Viewport <select id="size"><option value="1440">Desktop 1440px</option><option value="1024">Desktop 1024px</option><option value="390">Mobile 390px</option></select></label><span id="label"></span></header><div id="stage"><iframe title="AutoTrip UI fixture" src="./index.html"></iframe></div><script>
const frame=document.querySelector('iframe');if(new URLSearchParams(location.search).has('home'))frame.src='./index.html?home';const stage=document.querySelector('#stage');const size=document.querySelector('#size');
function resize(){const width=Number(size.value);const scale=Math.min(1,window.innerWidth/width);frame.style.width=width+'px';frame.style.height=1000+'px';frame.style.transform='scale('+scale+')';stage.style.height=1000*scale+'px';document.querySelector('#label').textContent=Math.round(scale*100)+'% preview';}
size.addEventListener('change',resize);window.addEventListener('resize',resize);resize();
</script></body></html>
